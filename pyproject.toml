[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "animora"
version = "0.1.0.dev0"
description = "High-level, declarative animation framework built on top of Manim for educational, technical, and algorithmic visualization."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Himanshu Jadhav", email = "himanshujadhav40@gmail.com" },
]
keywords = [
    "manim",
    "animation",
    "visualization",
    "education",
    "algorithms",
    "data-structures",
    "math",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "manim>=0.18.0,<1.0.0",
    "numpy>=1.24.0,<3.0.0",
    "networkx>=3.0,<4.0",
]

[project.optional-dependencies]
cli = [
    "click>=8.0",
    "rich>=13.0",
]
docs = [
    "mkdocs-material>=9.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "click>=8.0",
    "rich>=13.0",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/himanshu-jadhav108/Animora"
Documentation = "https://github.com/himanshu-jadhav108/Animora#readme"
Repository = "https://github.com/himanshu-jadhav108/Animora.git"
Issues = "https://github.com/himanshu-jadhav108/Animora/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/animora"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["animora"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "manim.*",
    "networkx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

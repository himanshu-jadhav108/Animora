<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" rx="8" fill="#0F172A" />
  <text x="30" y="40" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="16px" font-weight="700">Decision Tree Classifier (TreeLayout)</text>
  <text x="30" y="65" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12px">Max Depth: 2  |  Criterion: Gini Impurity</text>
  
  <!-- Connecting Edges -->
  <line x1="300" y1="130" x2="190" y2="200" stroke="#64748B" stroke-width="2" />
  <line x1="300" y1="130" x2="410" y2="200" stroke="#64748B" stroke-width="2" />

  <!-- Root Node -->
  <rect x="230" y="90" width="140" height="55" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
  <text x="300" y="112" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12px" font-weight="700" text-anchor="middle">X[0] &lt;= 2.45</text>
  <text x="300" y="132" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10px" text-anchor="middle">gini=0.50, n=100</text>

  <!-- Left Leaf (Pure Class 0) -->
  <rect x="120" y="200" width="140" height="55" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="190" y="222" fill="#10B981" font-family="'Inter', sans-serif" font-size="12px" font-weight="700" text-anchor="middle">Leaf: Class 0</text>
  <text x="190" y="242" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10px" text-anchor="middle">gini=0.00, n=45</text>

  <!-- Right Leaf (Class 1) -->
  <rect x="340" y="200" width="140" height="55" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="2" />
  <text x="410" y="222" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="12px" font-weight="700" text-anchor="middle">Leaf: Class 1</text>
  <text x="410" y="242" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10px" text-anchor="middle">gini=0.08, n=55</text>
</svg>

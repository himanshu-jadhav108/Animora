<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" rx="8" fill="#0F172A" />
  <text x="30" y="40" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="16px" font-weight="700">Principal Component Analysis (PCA)</text>
  <text x="30" y="65" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12px">Eigendecomposition: Cov(X) · v = λ · v  |  PC1 Var Ratio: 86.4%</text>
  
  <defs>
    <marker id="pcaArrow1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#F59E0B" />
    </marker>
    <marker id="pcaArrow2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38BDF8" />
    </marker>
  </defs>

  <!-- Centroid Point -->
  <circle cx="300" cy="190" r="6" fill="#F59E0B" />
  
  <!-- Principal Axis PC1 (Diagonal Arrow) -->
  <line x1="300" y1="190" x2="480" y2="90" stroke="#F59E0B" stroke-width="3" marker-end="url(#pcaArrow1)" />
  <text x="495" y="85" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="13px" font-weight="700">PC1 (λ₁ = 4.2)</text>

  <!-- Second Axis PC2 (Perpendicular Arrow) -->
  <line x1="300" y1="190" x2="230" y2="100" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#pcaArrow2)" />
  <text x="200" y="90" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="12px" font-weight="600">PC2 (λ₂ = 0.8)</text>

  <!-- Scatter points and orthogonal dashed projection lines -->
  <!-- pt 1 -->
  <circle cx="340" cy="130" r="5" fill="#38BDF8" />
  <line x1="340" y1="130" x2="360" y2="155" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="360" cy="155" r="4" fill="#F59E0B" />

  <!-- pt 2 -->
  <circle cx="430" cy="160" r="5" fill="#38BDF8" />
  <line x1="430" y1="160" x2="410" y2="128" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="410" cy="128" r="4" fill="#F59E0B" />

  <!-- pt 3 -->
  <circle cx="240" cy="250" r="5" fill="#38BDF8" />
  <line x1="240" y1="250" x2="230" y2="228" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="230" cy="228" r="4" fill="#F59E0B" />
</svg>

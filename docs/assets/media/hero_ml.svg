<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <linearGradient id="mlHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="700" height="380" rx="12" fill="url(#mlHeroGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Badge -->
  <rect x="40" y="32" width="170" height="28" rx="14" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-width="1.2" />
  <circle cx="56" cy="46" r="4" fill="#38BDF8" />
  <text x="70" y="50" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="12px" font-weight="700">AI / ML SUITE ACTIVE</text>

  <!-- Section 1: Surface & Optimization -->
  <g transform="translate(40, 90)">
    <rect width="185" height="250" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="32" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13px" font-weight="700">Optimization</text>
    <text x="20" y="52" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10px">Gradient Descent</text>
    
    <ellipse cx="92" cy="140" rx="65" ry="38" fill="none" stroke="#334155" stroke-width="1.5" />
    <ellipse cx="92" cy="140" rx="42" ry="24" fill="none" stroke="#475569" stroke-width="1.5" />
    <ellipse cx="92" cy="140" rx="20" ry="12" fill="none" stroke="#64748B" stroke-width="1.5" />
    
    <path d="M 140,115 Q 110,130 96,138" fill="none" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="140" cy="115" r="4" fill="#F59E0B" />
    <circle cx="92" cy="140" r="5" fill="#10B981" />
    <text x="92" y="215" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="700" text-anchor="middle">Step 15: Min</text>
  </g>

  <!-- Section 2: Deep Learning -->
  <g transform="translate(255, 90)">
    <rect width="185" height="250" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="32" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13px" font-weight="700">Deep Learning</text>
    <text x="20" y="52" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10px">Forward + Backprop</text>

    <!-- Neural Nodes -->
    <line x1="45" y1="110" x2="92" y2="135" stroke="#38BDF8" stroke-width="2" />
    <line x1="45" y1="160" x2="92" y2="135" stroke="#38BDF8" stroke-width="2" />
    <line x1="92" y1="135" x2="140" y2="135" stroke="#F59E0B" stroke-width="2.5" />

    <circle cx="45" cy="110" r="14" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <circle cx="45" cy="160" r="14" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <circle cx="92" cy="135" r="15" fill="#1E293B" stroke="#F59E0B" stroke-width="2" />
    <circle cx="140" cy="135" r="15" fill="#1E293B" stroke="#10B981" stroke-width="2.5" />

    <text x="92" y="215" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="700" text-anchor="middle">∂L/∂W = δ · aᵀ</text>
  </g>

  <!-- Section 3: NLP & Attention -->
  <g transform="translate(470, 90)">
    <rect width="190" height="250" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="32" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13px" font-weight="700">Transformers</text>
    <text x="20" y="52" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10px">Scaled Dot-Product</text>

    <!-- Mini Heatmap -->
    <rect x="35" y="105" width="30" height="30" rx="3" fill="#F59E0B" fill-opacity="0.9" />
    <rect x="70" y="105" width="30" height="30" rx="3" fill="#F59E0B" fill-opacity="0.2" />
    <rect x="105" y="105" width="30" height="30" rx="3" fill="#F59E0B" fill-opacity="0.1" />

    <rect x="35" y="140" width="30" height="30" rx="3" fill="#F59E0B" fill-opacity="0.2" />
    <rect x="70" y="140" width="30" height="30" rx="3" fill="#F59E0B" fill-opacity="0.8" />
    <rect x="105" y="140" width="30" height="30" rx="3" fill="#F59E0B" fill-opacity="0.2" />

    <text x="95" y="215" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="700" text-anchor="middle">Softmax(QKᵀ/√d)V</text>
  </g>
</svg>

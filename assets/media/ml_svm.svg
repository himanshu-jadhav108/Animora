<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" rx="8" fill="#0F172A" />
  <text x="30" y="40" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="16px" font-weight="700">Support Vector Machine (Maximum Margin)</text>
  <text x="30" y="65" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12px">Hyperplane: w·x + b = 0  |  Margin: 2 / ||w||</text>
  
  <!-- Separating Hyperplane (Solid Purple) -->
  <line x1="120" y1="270" x2="480" y2="90" stroke="#A855F7" stroke-width="3" />
  
  <!-- Positive Margin (Dashed Orange) -->
  <line x1="150" y1="290" x2="510" y2="110" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Negative Margin (Dashed Blue) -->
  <line x1="90" y1="250" x2="450" y2="70" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Class -1 Points -->
  <circle cx="160" cy="180" r="5" fill="#38BDF8" />
  <circle cx="210" cy="150" r="5" fill="#38BDF8" />
  <circle cx="260" cy="120" r="5" fill="#38BDF8" />

  <!-- Support Vector 1 (Negative) -->
  <circle cx="270" cy="160" r="6" fill="#38BDF8" />
  <circle cx="270" cy="160" r="14" fill="none" stroke="#F59E0B" stroke-width="2" />

  <!-- Class +1 Points -->
  <circle cx="340" cy="260" r="5" fill="#10B981" />
  <circle cx="390" cy="230" r="5" fill="#10B981" />
  <circle cx="440" cy="200" r="5" fill="#10B981" />

  <!-- Support Vector 2 (Positive) -->
  <circle cx="330" cy="200" r="6" fill="#10B981" />
  <circle cx="330" cy="200" r="14" fill="none" stroke="#F59E0B" stroke-width="2" />

  <text x="290" y="165" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="11px" font-weight="700">SV</text>
  <text x="350" y="205" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="11px" font-weight="700">SV</text>
</svg>

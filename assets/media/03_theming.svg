<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" rx="8" fill="#0F172A" />
  <!-- Paper Light Theme Card -->
  <g transform="translate(40, 40)">
    <rect width="240" height="260" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <text x="30" y="50" fill="#1E293B" font-family="'Inter', sans-serif" font-size="16px" font-weight="700">PaperLight</text>
    <rect x="30" y="80" width="180" height="80" rx="8" fill="#F1F5F9" stroke="#2563EB" stroke-width="2" />
    <circle cx="120" cy="210" r="30" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB" stroke-width="2" />
  </g>
  <!-- Cyberpunk Theme Card -->
  <g transform="translate(320, 40)">
    <rect width="240" height="260" rx="10" fill="#0A0A0F" stroke="#EC4899" stroke-width="2" />
    <text x="30" y="50" fill="#EC4899" font-family="'Inter', sans-serif" font-size="16px" font-weight="700">Cyberpunk Neon</text>
    <rect x="30" y="80" width="180" height="80" rx="8" fill="#161224" stroke="#10B981" stroke-width="2" />
    <circle cx="120" cy="210" r="30" fill="#EC4899" fill-opacity="0.2" stroke="#EC4899" stroke-width="2" />
  </g>
</svg>

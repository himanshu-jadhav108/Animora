<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" rx="8" fill="#0F172A" />
  <text x="30" y="40" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="16px" font-weight="700">Optimizer Trajectories: SGD vs Momentum vs Adam</text>
  <text x="30" y="65" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12px">Anisotropic Valley: f(x, y) = 10x² + y²</text>
  
  <!-- Ravine contours (elongated along y) -->
  <ellipse cx="300" cy="190" rx="220" ry="110" fill="none" stroke="#1E293B" stroke-width="2" />
  <ellipse cx="300" cy="190" rx="160" ry="80" fill="none" stroke="#334155" stroke-width="2" />
  <ellipse cx="300" cy="190" rx="100" ry="50" fill="none" stroke="#475569" stroke-width="2" />

  <!-- Trajectory 1: SGD (Cyan - high oscillation in x) -->
  <path d="M 450,110 L 400,160 L 380,140 L 350,175 L 330,165 L 310,185 L 300,190" fill="none" stroke="#38BDF8" stroke-width="2.5" />

  <!-- Trajectory 2: Momentum (Orange - overshoot with inertia) -->
  <path d="M 450,110 Q 380,180 340,210 T 305,188 L 300,190" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4,2" />

  <!-- Trajectory 3: Adam (Green - smooth adaptive descent) -->
  <path d="M 450,110 Q 360,140 300,190" fill="none" stroke="#10B981" stroke-width="3" />

  <!-- Legend -->
  <rect x="30" y="270" width="540" height="45" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <line x1="50" y1="292" x2="80" y2="292" stroke="#38BDF8" stroke-width="2.5" />
  <text x="90" y="296" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="12px" font-weight="600">SGD (Oscillating)</text>

  <line x1="230" y1="292" x2="260" y2="292" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4,2" />
  <text x="270" y="296" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="12px" font-weight="600">Momentum (Overshoot)</text>

  <line x1="430" y1="292" x2="460" y2="292" stroke="#10B981" stroke-width="3" />
  <text x="470" y="296" fill="#10B981" font-family="'Inter', sans-serif" font-size="12px" font-weight="600">Adam (Adaptive)</text>
</svg>

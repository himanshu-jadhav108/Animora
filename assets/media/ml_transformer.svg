<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" rx="8" fill="#0F172A" />
  <text x="30" y="40" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="16px" font-weight="700">Minimal Single-Head Transformer Block</text>
  <text x="30" y="65" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12px">Pipeline: Input Tokens → Attention Sublayer → Feed-Forward Sublayer</text>
  
  <defs>
    <marker id="transArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#F59E0B" />
    </marker>
    <marker id="transArrowGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Stage 1: Self-Attention Card -->
  <g transform="translate(60, 110)">
    <rect width="200" height="130" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <rect x="0" y="0" width="200" height="32" rx="6" fill="#38BDF8" fill-opacity="0.15" />
    <text x="100" y="22" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="12px" font-weight="700" text-anchor="middle">1. Self-Attention</text>
    
    <text x="100" y="65" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11px" text-anchor="middle">Q, K, V Projections</text>
    <text x="100" y="90" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="700" text-anchor="middle">Softmax(QKᵀ / √d) V</text>
    <text x="100" y="115" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10px" text-anchor="middle">d_k = 3</text>
  </g>

  <!-- Connecting Arrow -->
  <line x1="260" y1="175" x2="330" y2="175" stroke="#F59E0B" stroke-width="3" marker-end="url(#transArrow)" />
  <text x="295" y="165" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10px" text-anchor="middle">H_attn</text>

  <!-- Stage 2: Feed-Forward Card -->
  <g transform="translate(340, 110)">
    <rect width="200" height="130" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="2" />
    <rect x="0" y="0" width="200" height="32" rx="6" fill="#10B981" fill-opacity="0.15" />
    <text x="100" y="22" fill="#10B981" font-family="'Inter', sans-serif" font-size="12px" font-weight="700" text-anchor="middle">2. Feed-Forward Network</text>
    
    <text x="100" y="65" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11px" text-anchor="middle">Linear(d_k → d_ff)</text>
    <text x="100" y="90" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="700" text-anchor="middle">ReLU(H · W₁ + b₁) · W₂</text>
    <text x="100" y="115" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10px" text-anchor="middle">d_ff = 4</text>
  </g>

  <text x="300" y="280" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11px" text-anchor="middle">Exclusions: Single-head for clarity  •  Order implicit  •  No residual bypass clutter</text>
</svg>

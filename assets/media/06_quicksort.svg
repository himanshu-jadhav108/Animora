    <text x="435" y="42" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="18px" font-weight="700" text-anchor="middle">56</text>
    <text x="435" y="95" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12px" text-anchor="middle">[5]</text>

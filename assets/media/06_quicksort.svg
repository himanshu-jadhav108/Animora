<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" rx="8" fill="#0F172A" />
  
  <text x="300" y="60" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="16px" font-weight="700" text-anchor="middle">quick_sort(arr) Partition Step</text>

  <!-- Array Cells -->
  <g transform="translate(60, 110)">
    <!-- Cell 0: 7 (Swapped) -->
    <rect x="0" y="0" width="70" height="70" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="2.5" />
    <text x="35" y="42" fill="#10B981" font-family="'Inter', sans-serif" font-size="18px" font-weight="700" text-anchor="middle">7</text>
    <text x="35" y="95" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12px" text-anchor="middle">[0]</text>

    <!-- Cell 1: 12 -->
    <rect x="80" y="0" width="70" height="70" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <text x="115" y="42" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="18px" font-weight="700" text-anchor="middle">12</text>
    <text x="115" y="95" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12px" text-anchor="middle">[1]</text>

    <!-- Cell 2: 33 -->
    <rect x="160" y="0" width="70" height="70" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <text x="195" y="42" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="18px" font-weight="700" text-anchor="middle">33</text>
    <text x="195" y="95" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12px" text-anchor="middle">[2]</text>

    <!-- Cell 3: 45 (Pivot) -->
    <rect x="240" y="0" width="70" height="70" rx="8" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="3" />
    <text x="275" y="42" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="18px" font-weight="700" text-anchor="middle">45</text>
    <text x="275" y="95" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="12px" font-weight="600" text-anchor="middle">Pivot</text>

    <!-- Cell 4: 89 -->
    <rect x="320" y="0" width="70" height="70" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <text x="355" y="42" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="18px" font-weight="700" text-anchor="middle">89</text>
    <text x="355" y="95" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12px" text-anchor="middle">[4]</text>


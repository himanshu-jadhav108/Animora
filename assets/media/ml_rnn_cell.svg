<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" rx="8" fill="#0F172A" />
  <text x="30" y="40" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="16px" font-weight="700">RNN Sequential Hidden State Updates</text>
  <text x="30" y="65" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12px">Recurrence: h_t = tanh(W_xh · x_t + W_hh · h_{t-1} + b_h)</text>
  
  <defs>
    <marker id="rnnArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38BDF8" />
    </marker>
    <marker id="rnnArrowAccent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#F59E0B" />
    </marker>
  </defs>

  <!-- Cell t=0 -->
  <g transform="translate(90, 120)">
    <rect width="100" height="70" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <text x="50" y="32" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12px" font-weight="700" text-anchor="middle">RNN Cell</text>
    <text x="50" y="52" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10px" text-anchor="middle">h_0 = [0.4, 0.1]</text>

    <!-- Input from bottom -->
    <line x1="50" y1="120" x2="50" y2="78" stroke="#F59E0B" stroke-width="2" marker-end="url(#rnnArrowAccent)" />
    <text x="50" y="140" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11px" text-anchor="middle">x_0</text>
  </g>

  <!-- Connecting Hidden arrow t0 -> t1 -->
  <line x1="190" y1="155" x2="245" y2="155" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#rnnArrow)" />
  <text x="218" y="145" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10px" text-anchor="middle">h_0</text>

  <!-- Cell t=1 -->
  <g transform="translate(250, 120)">
    <rect width="100" height="70" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <text x="50" y="32" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12px" font-weight="700" text-anchor="middle">RNN Cell</text>
    <text x="50" y="52" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10px" text-anchor="middle">h_1 = [0.7, 0.5]</text>

    <!-- Input from bottom -->
    <line x1="50" y1="120" x2="50" y2="78" stroke="#F59E0B" stroke-width="2" marker-end="url(#rnnArrowAccent)" />
    <text x="50" y="140" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11px" text-anchor="middle">x_1</text>
  </g>

  <!-- Connecting Hidden arrow t1 -> t2 -->
  <line x1="350" y1="155" x2="405" y2="155" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#rnnArrow)" />
  <text x="378" y="145" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10px" text-anchor="middle">h_1</text>

  <!-- Cell t=2 -->
  <g transform="translate(410, 120)">
    <rect width="100" height="70" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="2.5" />
    <text x="50" y="32" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12px" font-weight="700" text-anchor="middle">RNN Cell</text>
    <text x="50" y="52" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10px" font-weight="700" text-anchor="middle">h_2 = [0.9, 0.8]</text>

    <!-- Input from bottom -->
    <line x1="50" y1="120" x2="50" y2="78" stroke="#F59E0B" stroke-width="2" marker-end="url(#rnnArrowAccent)" />
    <text x="50" y="140" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11px" text-anchor="middle">x_2</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" rx="8" fill="#0F172A" />
  <!-- Edges -->
  <line x1="300" y1="60" x2="180" y2="130" stroke="#475569" stroke-width="3" />
  <line x1="300" y1="60" x2="420" y2="130" stroke="#475569" stroke-width="3" />
  <line x1="180" y1="130" x2="120" y2="200" stroke="#475569" stroke-width="3" />
  <line x1="180" y1="130" x2="240" y2="200" stroke="#475569" stroke-width="3" />
  <line x1="240" y1="200" x2="210" y2="270" stroke="#10B981" stroke-width="3" stroke-dasharray="4 4" />

  <!-- Nodes -->
  <circle cx="300" cy="60" r="24" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5" />
  <text x="300" y="65" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14px" font-weight="700" text-anchor="middle">50</text>

  <circle cx="180" cy="130" r="24" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5" />
  <text x="180" y="135" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14px" font-weight="700" text-anchor="middle">30</text>

  <circle cx="420" cy="130" r="24" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5" />
  <text x="420" y="135" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14px" font-weight="700" text-anchor="middle">70</text>

  <circle cx="120" cy="200" r="22" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5" />
  <text x="120" y="205" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13px" font-weight="700" text-anchor="middle">20</text>

  <circle cx="240" cy="200" r="22" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5" />
  <text x="240" y="205" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13px" font-weight="700" text-anchor="middle">40</text>

  <!-- Inserted Node -->
  <circle cx="210" cy="270" r="22" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="2.5" />
  <text x="210" y="275" fill="#10B981" font-family="'Inter', sans-serif" font-size="13px" font-weight="700" text-anchor="middle">35</text>

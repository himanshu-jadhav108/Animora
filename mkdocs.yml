site_name: Animora
site_description: High-level, declarative animation framework built on top of Manim.
site_author: Himanshu Jadhav
site_url: https://himanshu-jadhav108.github.io/Animora/
repo_url: https://github.com/himanshu-jadhav108/Animora
repo_name: himanshu-jadhav108/Animora

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - First Scene: getting-started/first-scene.md
  - Guides:
      - Visual Components: guides/components.md
      - Layout Solvers: guides/layout.md
      - Theming & Tokens: guides/theming.md
      - Data Visualization: guides/dataviz.md
      - Data Structures: guides/datastructures.md
      - Algorithms: guides/algorithms.md
      - AI & ML Foundations: ml/foundations.md
      - Classic Machine Learning: ml/classic-ml.md
      - Deep Learning: ml/deep-learning.md
      - NLP & Attention: ml/nlp-and-attention.md
      - CLI: guides/cli.md
  - Examples & Gallery: examples/gallery.md
  - Recipes:
      - Custom Layout: recipes/custom-layout.md
      - Theme Switching: recipes/theme-switching.md
      - Manim Escape Hatch: recipes/escape-hatch.md
  - API Reference: reference/api.md
  - Troubleshooting: troubleshooting.md
  - Migration Guide: migration.md
  - API Stability: stability.md
  - Architecture:
      - System Overview: architecture/00-overview.md
      - Module Boundaries: architecture/module-boundaries.md
      - API Philosophy: architecture/api-philosophy.md
      - ML API Contract: architecture/ml-api-contract.md
      - Dependency Policy: architecture/dependency-policy.md
      - Versioning Strategy: architecture/versioning-strategy.md
      - Docs Media Strategy: architecture/docs-media-strategy.md
  - Governance & Licensing:
      - Copyright & Ownership: governance/copyright.md
      - Brand & Trademarks: governance/trademarks.md
      - Third-Party Notices: governance/third-party-notices.md
      - Contributing Guide: governance/contributing.md
      - Security Policy: governance/security.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
